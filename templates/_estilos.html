<style>
  @page { size: A4; margin: 2cm 1.6cm; }
  body { font-family: "Helvetica", "Arial", sans-serif; color: #222; font-size: 10.5pt; line-height: 1.4; }
  header { display: flex; align-items: center; border-bottom: 3px solid #111; padding-bottom: 10px; margin-bottom: 16px; }
  header img { height: 75px; width: auto; margin-right: 14px; }
  header h1 { font-size: 17pt; margin: 0; }
  header .subtitulo { font-size: 10pt; color: #555; }
  .datos { background: #f4f4f4; padding: 9px 13px; border-radius: 6px; margin-bottom: 14px; font-size: 10pt; }
  h2 { font-size: 12.5pt; border-left: 4px solid #111; padding-left: 8px; margin: 18px 0 8px; }
